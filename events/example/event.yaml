# hackathon-ops event config.
# Copy with the event_init tool (it fills event_id and github.org), then edit.
# Everything an event changes lives here; the server code never changes per event.

event_id: example            # must match the folder name: events/<event_id>/
timezone: Asia/Seoul
write_delay_ms: 1000         # pause between GitHub writes

github:
  org: your-hackathon-org    # a fresh org per event is recommended
  team_name: "Team{team_no}" # e.g. "Team{team_no}{track_id}" -> Team01H when tracks share numbers
  team_no_pad: 2             # 1 -> 01
  invite_by_email: false     # invite people without a GitHub username by email (anyone can accept it, so off by default)

roster:
  source: google_sheets      # google_sheets | csv
  # The sheet's link, as copied from the browser or from Drive ("Copy link"). roster_sources checks it.
  spreadsheet: "https://docs.google.com/spreadsheets/d/<id>/edit"
  # For csv, these are file paths relative to this folder instead of tab names.
  participants_tab: 웹신청
  assignment_tab: 팀배정       # one row per person: team number, email, role, track
  github_ids_tab: GitHub아이디  # optional: responses of a separate "GitHub username" form
  columns:                    # participants tab column -> field
    email: 이메일
    name: 성함
    google_sub: 계정 식별자
    # github_login: GitHub 아이디   # when the application form asks for it
  assignment_columns:
    team_no: 팀 번호
    email: 이메일
    role: 역할                 # "leader"/"조장" marks the leader, anything else is a member
    track: 트랙
  github_ids_columns:
    email: 이메일 주소          # Google Forms' collected email column
    github_login: GitHub 아이디

teams:
  size: [2, 6]

tracks:                      # key = canonical name; aliases = what may appear in the sheet
  hackathon:
    id: H
    aliases: [해커톤]
    teams: ["11-20"]          # which team numbers are in this track (lets repo tools work without a roster)
    freeze_at: "2027-01-01T10:00:00+09:00"   # per-track deadline (falls back to schedule.freeze_at)
    # template: your-hackathon-org/template-hackathon
  assignment:
    id: A
    aliases: [구현과제, 구현 과제]
    teams: ["01-10"]
    freeze_at: "2027-01-01T09:00:00+09:00"
    # template: your-hackathon-org/template-assignment

repo:
  name_pattern: "{team_name}"
  visibility: private        # private during the event; repos_visibility makes them public afterwards
  leader_permission: maintain
  member_permission: push
  ruleset:
    enabled: true            # private repos need a paid plan for rulesets; skipped automatically otherwise
    block_force_push: true
    block_deletion: true
  topics: ["{event_id}"]
  readme_required_sections: [서비스 링크, 기술 스택, 구현한 기능, 못 한 것]

reviewers:                   # mentors and judges are registered with reviewer_set (read-only, private repos only)
  expires_at: "2026-12-31T18:00:00+09:00"

schedule:                    # schedule_get / schedule_set change these without editing by hand
  start_at: "2026-12-31T09:00:00+09:00"
  prep_enabled: false          # true: commits from prep_from until start_at are allowed (not flagged)
  # prep_from: "2026-12-20T00:00:00+09:00"
  freeze_enabled: true         # false: no late-push checks (locking still works); tracks can override
  freeze_at: "2027-01-01T10:00:00+09:00"

app_policy: ../../policies/app-policy.yaml
